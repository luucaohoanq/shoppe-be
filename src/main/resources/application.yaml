spring:
  application:
    name: shoppe-be
  security:

  profiles:
    active: dev

  #  data:
  #    redis:
  #      host: ${REDIS_HOST:localhost} # Default to 'localhost' if not provided
  #      port: ${REDIS_PORT:6380}      # Default to 6379 if not provided

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    doc-expansion: none
    enabled: true
    path: /swagger-ui.html
    oauth:
      client-id: ${KC_SHOPPE_BE_CLIENT_ID:shoppe-be}
      client-secret: ${KC_SHOPPE_BE_SECRET_KEY:WwlQqs5mYFF5IxNrz42ijId1DPwTowGV}

# Logging configuration
logging:
  config: classpath:logback-spring.xml
  level:
    # Your application logging level
    com.orchid.orchidbe: ${APP_LOG_LEVEL:INFO}

    # Framework logging levels (reduce noise)
    org.springframework: ${SPRING_LOG_LEVEL:WARN}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.data.jpa: ${JPA_LOG_LEVEL:INFO}

    # Root level
    root: ${ROOT_LOG_LEVEL:WARN}

    # Uncomment for SQL debugging
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  # Pattern for console (only used if not overridden by logback-spring.xml)
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) %X{requestId:--} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} %X{requestId:--} - %msg%n"

# Keycloak configuration
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:9099}
  realm: ${KEYCLOAK_REALM_NAME:shoppe}
  client-id: ${KC_SHOPPE_BE_CLIENT_ID:shoppe-be}
  client-secret: ${KEYCLOAK_SECRET:default-secret}
  grant-type: client_credentials
  username: ${KEYCLOAK_INIT_USERNAME:user}
  password: ${KEYCLOAK_INIT_PASSWORD:1}

app:
  cors:
    allowed-origins:
      - http://localhost:4000
      - http://localhost:4003

#health check
management:
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
    loggers:
      access: unrestricted