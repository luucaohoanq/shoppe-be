spring:
  application:
    name: shoppe-be
  security:

  profiles:
    active: prod

  #  data:
  #    redis:
  #      host: ${REDIS_HOST:localhost} # Default to 'localhost' if not provided
  #      port: ${REDIS_PORT:6380}      # Default to 6379 if not provided

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

  api-docs:
    enabled: true

#health check
management:
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: always
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted